<!doctype html><meta charset="utf-8"><body style="font:12px monospace;white-space:pre"><div id="out">start</div>
<script>
const O=document.getElementById('out'),L=[],P=x=>{L.push(x);O.textContent=L.join('\n');};
const f=document.createElement('iframe');
f.style.cssText='width:1400px;height:860px;border:0;position:absolute;left:0;top:0';
f.src='./index.html?debug=1'; document.body.appendChild(f);
f.onload=()=>setTimeout(()=>{try{run()}catch(e){P('ERR '+e.message+'\n'+e.stack)}},5000);
function run(){
 const w=f.contentWindow,d=f.contentDocument;
 if(w.__odyssey) w.__odyssey.tl.time(14.6);
 const q=s=>d.querySelectorAll(s).length;
 P('=== 14 站同步 ===');
 P('  地图节点='+q('.omap .node')+'   全览格='+q('#grid .tile')+'   时间尺段='+q('.chron-seg'));
 const t=d.body.innerText;
 P('  文案 "十四站" 出现='+((t.match(/十四站/g)||[]).length)+'   残留 "十三站"='+((t.match(/十三站/g)||[]).length));
 P('  ledger: '+(d.querySelector('.ledger')?d.querySelector('.ledger').innerText.replace(/\n/g,' '):'?'));
 P('  图例: '+[...d.querySelectorAll('.plaque')].map(b=>b.textContent.trim()).join(' | '));
 P('');P('=== 航线 ===');
 const segs=[...d.querySelectorAll('#map .seg')];
 const byKind={};segs.forEach(s=>{const k=[...s.classList].filter(c=>c!=='seg')[0]||'?';byKind[k]=(byKind[k]||0)+1;});
 P('  航段总数='+segs.length+'   '+JSON.stringify(byKind));
 P('  drift 线型存在='+(byKind.drift>0?'YES ('+byKind.drift+' 段)':'NO'));
 const ds=d.querySelector('#map .seg.drift');
 if(ds){const cs=w.getComputedStyle(ds);P('  drift 样式 stroke='+cs.stroke+' dash='+cs.strokeDasharray);}
 P('');P('=== 删除项 ===');
 P('  zone-tag 神话地理/可考地理='+q('.zone-tag')+' (应为 0)');
 P('  note__plate='+ (d.querySelector('.note__plate')?w.getComputedStyle(d.querySelector('.note__plate')).display:'元素不存在'));
 P('');P('=== 制图层 ===');
 P('  恒向线='+q('.omap .rl')+'  山='+q('.mtn')+'  城市='+q('.town')+'  河='+q('.river')+'  地名='+q('.cname'));
 P('');P('=== Landmark 舞台 ===');
 const st=d.querySelector('.landmark-stage'),r=st.getBoundingClientRect();
 P('  '+r.width.toFixed(0)+'x'+r.height.toFixed(0)+'  z='+w.getComputedStyle(st).zIndex+'  pe='+w.getComputedStyle(st).pointerEvents);
 P('');P('=== 命中测试 ===');
 let pass=0,bad=[];
 const hit=(el,lab)=>{if(!el){bad.push(lab+':缺失');return;}
   const b=el.getBoundingClientRect(); if(!b.width||!b.height){bad.push(lab+':0尺寸');return;}
   const tp=d.elementFromPoint(b.left+b.width/2,b.top+b.height/2);
   if(el===tp||el.contains(tp)||(tp&&tp.contains(el)))pass++;else bad.push(lab+'<-'+(tp?(tp.getAttribute('class')||tp.tagName):'null'));};
 [...d.querySelectorAll('.omap .plaque')].forEach((b,i)=>hit(b,'图例'+i));
 [...d.querySelectorAll('.omap .node')].forEach((n,i)=>hit(n,'node'+i));
 hit(d.querySelector('#prev'),'prev');hit(d.querySelector('#next'),'next');
 [...d.querySelectorAll('.foldtab')].forEach((b,i)=>hit(b,'tab'+i));
 [...d.querySelectorAll('.chron-seg')].slice(0,3).forEach((b,i)=>hit(b,'年表'+i));
 P('  通过 '+pass+'  失败 '+bad.length+(bad.length?' -> '+bad.join(' | '):''));
}
</script>
