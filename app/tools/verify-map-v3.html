<!doctype html>
<meta charset="utf-8">
<title>Map V3 verification</title>
<body style="font:12px monospace;white-space:pre"><div id="out">running…</div>
<script>
const f = document.createElement('iframe');
f.style.cssText = 'width:1400px;height:860px;border:0;position:absolute;left:0;top:0';
f.src = './index.html?debug=1';
document.body.appendChild(f);
const sleep = m => new Promise(r => setTimeout(r, m));
const L = [];

f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  await sleep(4000);
  const tl = w.__odyssey && w.__odyssey.tl;
  if (tl) tl.time(14.6);
  await sleep(800);

  /* ── 制图层 ── */
  L.push('=== 古典制图层 ===');
  const q = s => d.querySelectorAll(s).length;
  L.push('  恒向线 rl=' + q('.omap .rl') + '  (16 玫瑰 x 32 线 = 512)');
  L.push('  隐形圆=' + q('.carto__hidden-circle') + '  风玫瑰节点=' + q('.carto__nexus'));
  L.push('  主风玫瑰 blade=' + q('.rose__blade') + '  tick=' + q('.rose__tick') + '  fleur=' + q('.rose__fleur'));
  L.push('  海岸排线 use=' + q('.carto__coast use') + '  海面点刻=' + q('.carto__stipple') + '  波纹=' + q('.wv'));
  L.push('  糖块山=' + q('.mtn') + '  山影=' + q('.mtn__shade') + '  河流=' + q('.river') + '  聚落=' + q('.town'));
  L.push('  古典地名=' + q('.cname'));
  const trail = d.querySelector('.omap .trail');
  L.push('  航线色=' + (trail ? w.getComputedStyle(trail).stroke : 'n/a') + '  (应为陈年群青)');

  /* ── 布局 ── */
  L.push('');
  L.push('=== 布局 ===');
  const slot = d.querySelector('.map-cartouche-slot');
  const chart = d.querySelector('#chart');
  const nb = d.querySelector('#notebook');
  const sr = slot.getBoundingClientRect(), cr = chart.getBoundingClientRect(), nr = nb.getBoundingClientRect();
  L.push('  题记 ' + sr.width.toFixed(0) + 'x' + sr.height.toFixed(0) + ' @(' + sr.left.toFixed(0) + ',' + sr.top.toFixed(0) + ')');
  L.push('  题记宽度在 280–360 区间: ' + (sr.width >= 279 && sr.width <= 361 ? 'YES' : 'NO ' + sr.width.toFixed(0)));
  L.push('  题记高度 <=120: ' + (sr.height <= 121 ? 'YES ' + sr.height.toFixed(0) : 'NO ' + sr.height.toFixed(0)));
  L.push('  海图 top=' + cr.top.toFixed(0) + ' 高=' + cr.height.toFixed(0) + '  (未被题记整体下推)');
  L.push('  笔记本 left=' + nr.left.toFixed(0) + '  海图 right=' + cr.right.toFixed(0) + '  重叠: ' + (nr.left >= cr.right - 2 ? '无' : '有 ' + (cr.right - nr.left).toFixed(0) + 'px'));
  L.push('  顶栏已移除: ' + (w.getComputedStyle(d.querySelector('.mapheader')).display === 'none' ? 'YES' : 'NO'));

  /* ── 命中测试（真实 elementFromPoint）── */
  L.push('');
  L.push('=== 交互命中测试 (elementFromPoint) ===');
  let pass = 0, fail = 0;
  const hit = (el, label) => {
    if (!el) { L.push('  ✗ ' + label + ' 不存在'); fail++; return; }
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height) { L.push('  ✗ ' + label + ' 尺寸为0'); fail++; return; }
    const t = d.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
    const ok = el === t || el.contains(t) || (t && t.contains(el));
    if (ok) { pass++; } else { fail++; L.push('  ✗ ' + label + ' 被 ' + (t ? (t.getAttribute('class') || t.tagName) : 'null') + ' 遮挡'); }
  };
  [...d.querySelectorAll('.omap .plaque')].forEach((b, i) => hit(b, '图例/播放' + i + ' ' + b.textContent.trim().slice(0, 6)));
  [...d.querySelectorAll('.omap .node')].forEach((n, i) => hit(n, 'node' + i));
  hit(d.querySelector('#prev'), 'prev'); hit(d.querySelector('#next'), 'next');
  [...d.querySelectorAll('.foldtab')].forEach(b => hit(b, 'tab ' + b.textContent.trim()));
  L.push('  通过 ' + pass + ' / 失败 ' + fail);

  /* ── Landmark 逐站 ── */
  L.push('');
  L.push('=== Landmark 13 站 ===');
  const stage = d.querySelector('.landmark-stage');
  const st = stage.getBoundingClientRect();
  L.push('  舞台 ' + st.width.toFixed(0) + 'x' + st.height.toFixed(0) + ' @(' + st.left.toFixed(0) + ',' + st.top.toFixed(0) + ')  z=' + w.getComputedStyle(stage).zIndex);
  L.push('  pointer-events=' + w.getComputedStyle(stage).pointerEvents);
  for (let i = 0; i < 13; i++) {
    d.dispatchEvent(new w.CustomEvent('odyssey:select', { detail: { index: i } }));
    await sleep(1700);
    const vis = [...d.querySelectorAll('.landmark')].filter(x => {
      const cs = w.getComputedStyle(x);
      return cs.visibility !== 'hidden' && +cs.opacity > 0.02;
    });
    const srcs = vis.map(x => (x.querySelector('img').getAttribute('src') || '').split('/').pop());
    const ops = vis.map(x => (+w.getComputedStyle(x).opacity).toFixed(2));
    L.push('  站' + String(i).padStart(2) + '  可见=' + vis.length + '  ' + (srcs.join(',') || '(无)') + '  op=' + (ops.join(',') || '-'));
  }

  /* 快速连点不堆积 */
  for (let i = 0; i < 6; i++) {
    d.dispatchEvent(new w.CustomEvent('odyssey:select', { detail: { index: [0,3,7,12,4,8][i] } }));
    await sleep(120);
  }
  await sleep(1800);
  const after = [...d.querySelectorAll('.landmark')].filter(x => {
    const cs = w.getComputedStyle(x);
    return cs.visibility !== 'hidden' && +cs.opacity > 0.02;
  });
  L.push('  快速连点 6 次后可见数=' + after.length + ' (应为 1)  op=' + after.map(x => (+w.getComputedStyle(x).opacity).toFixed(2)).join(','));

  document.getElementById('out').textContent = L.join('\n');
};
</script>
